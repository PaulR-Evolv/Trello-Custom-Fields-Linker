<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <script>
    window.TrelloPowerUp.initialize({
      'board-buttons': function(t, options) {
        return [{
          icon: {
            dark: 'https://cdn-icons-png.flaticon.com/512/2040/2040504.png',
            light: 'https://cdn-icons-png.flaticon.com/512/2040/2040504.png'
          },
          text: 'Field Linker Setup',
          condition: 'always',
          callback: function(t) {
            return t.modal({ 
              url: './dashboard.html', 
              height: 500, 
              fullscreen: false,
              title: 'Manage Linking Rules' 
            });
          }
        }];
      },
      'card-back-section': function(t, options) {
        return {
          title: 'Smart Linked Fields',
          icon: 'https://cdn-icons-png.flaticon.com/512/2040/2040504.png',
          content: { 
            type: 'iframe', 
            url: t.signUrl('./section.html'), 
            height: 250 
          }
        };
      }
    });
  </script>
</body>
</html>
